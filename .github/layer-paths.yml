# Layer path mapping — the single source of truth for CI path filters.
# Referenced by .github/scripts/detect-layers.mjs; do not copy globs into workflows.
#
# Allowed pattern forms (anything else is rejected at load time):
#   1. Directory prefix: apps/desktop/src/**
#   2. Extension or exact file: *.md, apps/desktop/electron-builder.yml
#
# Do not use brace expansion, negation, nested globs (src/**/*.ts), or
# basename wildcards (tsconfig*). List exact files instead.
#
# Two mapping families:
#   content / service / shell / docs                 → 发布分层（热更新与部署车道）
#   desktop / web_e2e / shared_visual / openapi /
#   postgres_integration                             → 独立 CI 门禁
# Desktop includes packages/** on purpose: ui / product-ui / contracts / domain
# (and the rest) can affect the desktop renderer, so the E2E gate is conservative.
# tests/repo/** is the source-check ratchet (docker context, file-size, boundaries).
# It is content+service so a guard-only change still runs hosted checks, but does
# not light Electron E2E. tests/e2e, tests/package, and tests/fixtures stay on the
# desktop E2E group.
#
# Hitting any `infra` path treats content, service, shell, and desktop as changed.
# `infra/**` is the production Caddy/compose/Dockerfile tree. `scripts/deploy/**`
# is the production deploy tooling. Both are infra so a deploy-script change
# cannot skip the Web/API lanes.
# `tooling/**` is the v1.2.2 shared engineering config (ESLint base, tsconfig.base,
# depcruise rules + baseline). Changing it is a full-layer infra change.
# `packages/contracts/**` is listed under both content and service (§3.3).
# `packages/update-protocol/**` is listed under both content and shell: the
# renderer consumes Channel as a type, and the main process compiles the
# protocol package into the shell.
# `packages/desktop-contracts/**` is listed under both content and shell: IPC /
# SQLite row types are consumed by the renderer (hot-update) and implemented by
# the main process (tag-released shell, minShellVersion). Dual-listing is the
# conservative trigger so neither lane is skipped.
# `packages/core/**` is listed under shell: the main process imports SQLite /
# Provider from @musefold/core. The renderer does not import core (DIR-02).
# `packages/domain/**` is listed under both content and service: the renderer
# consumes domain types, and apps/web-api depends on @musefold/domain.
# `apps/desktop/tsconfig.node.json` / `tsconfig.web.json` are desktop compile
# units, not infra (infra would light service). They follow electron/** → shell
# and src/** → content.
# Unmapped paths fail-open (all product layers and desktop true) in detect-layers.mjs.
#
# This file is parsed by a restricted subset parser (comments, `key:`, `- item`,
# optional quotes). Do not add anchors, flow collections, or other YAML features.

infra:
  - package.json
  - package-lock.json
  - turbo.json
  - tsconfig.json
  - eslint.config.mjs
  - tooling/**
  - infra/**
  - scripts/deploy/**
  - .prettierrc
  - .prettierignore
  - vitest.config.ts
  - postcss.config.js
  - tailwind.config.ts
  - vite.preview.config.ts
  - .github/**

content:
  - apps/desktop/src/**
  - apps/desktop/electron.vite.config.ts
  - apps/desktop/tsconfig.web.json
  - apps/web/**
  - website/Musefold/**
  - packages/ui/**
  - packages/product-ui/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**
  - packages/desktop-contracts/**
  - packages/update-protocol/**
  - tests/repo/**

service:
  - apps/web-api/**
  - apps/generation-worker/**
  - services/musefold-downloads/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**
  - packages/new-api-client/**
  - packages/server-crypto/**
  - tests/repo/**

shell:
  - apps/desktop/electron/**
  - apps/desktop/electron.vite.config.ts
  - apps/desktop/package.json
  - apps/desktop/tsconfig.node.json
  - resources/**
  - apps/desktop/electron-builder.yml
  # Protocol package is compiled into the main process; renderer consumes Channel types.
  - packages/update-protocol/**
  # IPC contracts are implemented by the main process; renderer consumes the types.
  - packages/desktop-contracts/**
  # Main process imports SQLite / Provider; renderer does not import core.
  - packages/core/**

desktop:
  - apps/desktop/**
  - packages/**
  - resources/**
  - tests/e2e/**
  - tests/package/**
  - tests/fixtures/**
  - requirements-test.txt
  - apps/desktop/electron-builder.yml

web_e2e:
  - apps/web/**
  - packages/ui/**
  - packages/product-ui/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**

shared_visual:
  - apps/web/**
  - apps/desktop/src/**
  - apps/desktop/electron.vite.config.ts
  - apps/desktop/tsconfig.web.json
  - packages/ui/**
  - packages/product-ui/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**
  - packages/desktop-contracts/**
  - tests/e2e/**
  - requirements-test.txt

openapi:
  - apps/web-api/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**
  - packages/new-api-client/**
  - packages/server-crypto/**

postgres_integration:
  - apps/web-api/**
  - apps/generation-worker/**
  - packages/contracts/**
  - packages/domain/**
  - packages/cloud-client/**
  - packages/new-api-client/**
  - packages/server-crypto/**

docs:
  - docs/**
  - doc/**
  - '*.md'
