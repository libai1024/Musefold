name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  MUSEFOLD_TVT_KEY: ""

jobs:
  check:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck, unit tests, build
        run: npm run check

      - name: Dependency audit
        run: npm audit --json

      - name: Clean generated artifacts
        run: npm run clean:artifacts

      - name: Local release preflight
        run: npm run release:preflight

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Install Linux GUI deps
        run: sudo python -m playwright install-deps

      - name: Build app
        run: npm run build

      - name: Full Electron E2E
        run: xvfb-run -a python -m pytest tests/e2e -q

  mac-package-smoke:
    name: macOS package smoke
    runs-on: macos-latest
    timeout-minutes: 35
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Build macOS package
        run: npm run package:mac

      - name: Verify DMG
        run: hdiutil verify release/Musefold-0.3.0-dev-arm64.dmg

      - name: macOS signing evidence reminder (macosDeveloperIdNotarization)
        run: npm run release:macos:signing

      - name: macOS package smoke test
        run: python -m pytest tests/package/macos_package_smoke.py -q

  windows-package-smoke:
    name: Windows package and runtime smoke
    runs-on: windows-latest
    timeout-minutes: 60
    needs: check
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Build Windows package
        run: npm run package:win -- --arm64

      - name: Windows package smoke test
        run: python -m pytest tests/package/windows_package_smoke.py -q

      - name: Build Windows host package for runtime smoke
        run: npm run package:win -- --x64

      - name: Windows installed-package runtime smoke
        run: python -m pytest tests/package/windows_runtime_smoke.py -q

      - name: Write Windows hosted runtime evidence
        run: npm run release:windows:hosted -- --runtime-smoke-passed --out release/windows-hosted-runtime-evidence.json

      - name: Upload Windows hosted runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-hosted-runtime-evidence
          path: release/windows-hosted-runtime-evidence.json
