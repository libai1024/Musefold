# Fast-lane CI (source checks + desktop E2E).
# App semver single source of truth: `apps/desktop/package.json`.
# Document versions (v1.2.1, etc.) are independent of app semver.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CI: true
  MUSEFOLD_TVT_KEY: ''
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      content: ${{ steps.detect.outputs.content }}
      service: ${{ steps.detect.outputs.service }}
      shell: ${{ steps.detect.outputs.shell }}
      desktop: ${{ steps.detect.outputs.desktop }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect changed layers
        id: detect
        run: node .github/scripts/detect-layers.mjs

  check:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    env:
      NODE_VERSION: '24'
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Skill update decision gate
        run: npm run skill:check:ci

      - name: Install deps
        run: npm ci

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck, unit tests, build
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: npx turbo run typecheck test build lint check:boundaries check:ui-boundaries ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Dependency audit
        run: npm audit --json

      - name: Clean generated artifacts
        run: npm run clean:artifacts

      - name: Local release preflight
        run: npm run release:preflight

  e2e:
    name: Electron E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, check]
    # Desktop E2E is gated by the `desktop` path group, not by release layers.
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Install Linux GUI deps
        run: sudo python -m playwright install-deps

      - name: Build app
        run: npm run build

      - name: Full Electron E2E
        run: xvfb-run -a python -m pytest tests/e2e -q
