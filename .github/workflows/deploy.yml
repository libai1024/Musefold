# Production deploy (content + service).
# Hosted CI verifies. This workflow only runs on the self-hosted musefold-prod
# runner after CI on main is green. It never runs for pull requests or forks.
#
# App semver is unrelated; this job deploys git SHA tags, not product versions.
name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: git sha to deploy (empty = this commit)
        required: false
        type: string
      layers:
        description: which layers to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - content
          - service

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: musefold-prod
    runs-on: [self-hosted, musefold-prod]
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node (runner-local, not host-wide)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and verify deploy SHA
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            REQUESTED="${REQUESTED_SHA:-origin/main}"
            if ! SHA="$(git rev-parse --verify "${REQUESTED}^{commit}" 2>/dev/null)"; then
              echo "refusing unresolved deploy sha: $REQUESTED" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "refusing sha outside origin/main: $SHA" >&2
              exit 1
            fi
            SHA="$SHA" node - <<'NODE'
            const expectedSha = process.env.SHA;
            const url = new URL(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs`);
            url.searchParams.set('event', 'push');
            url.searchParams.set('branch', 'main');
            url.searchParams.set('status', 'completed');
            url.searchParams.set('head_sha', expectedSha);
            url.searchParams.set('per_page', '100');
            const response = await fetch(url, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error(`GitHub Actions API returned ${response.status}`);
            const body = await response.json();
            const eligible = body.workflow_runs?.some(
              (run) =>
                run.name === 'CI' &&
                run.event === 'push' &&
                run.head_branch === 'main' &&
                run.head_sha === expectedSha &&
                run.status === 'completed' &&
                run.conclusion === 'success',
            );
            if (!eligible) throw new Error(`no successful completed CI push run on main for ${expectedSha}`);
            NODE
          else
            SHA="$WORKFLOW_RUN_SHA"
            if ! git rev-parse --verify "${SHA}^{commit}" >/dev/null 2>&1; then
              echo "refusing unresolved workflow_run sha: $SHA" >&2
              exit 1
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Download triggering CI layer evidence
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deploy-layer-evidence
          path: deploy-layer-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve deploy layers
        id: detect
        env:
          EXPECTED_SHA: ${{ steps.ref.outputs.sha }}
          REQUESTED_LAYERS: ${{ inputs.layers }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            EVIDENCE=deploy-layer-evidence/layers.json
            node -e '
              const fs = require("node:fs");
              const evidence = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const expectedSha = process.env.EXPECTED_SHA;
              if (evidence.head_sha !== expectedSha) {
                throw new Error(`deploy evidence head_sha ${evidence.head_sha} does not match ${expectedSha}`);
              }
              for (const key of ["content", "service"]) {
                if (typeof evidence[key] !== "boolean") throw new Error(`invalid deploy evidence ${key}`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${evidence[key]}\n`);
              }
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "docs_only=false\n");
            ' "$EVIDENCE"
            exit 0
          fi
          case "${REQUESTED_LAYERS:-all}" in
            all)
              echo "content=true" >> "$GITHUB_OUTPUT"
              echo "service=true" >> "$GITHUB_OUTPUT"
              ;;
            content)
              echo "content=true" >> "$GITHUB_OUTPUT"
              echo "service=false" >> "$GITHUB_OUTPUT"
              ;;
            service)
              echo "content=false" >> "$GITHUB_OUTPUT"
              echo "service=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "refusing invalid layers: $REQUESTED_LAYERS" >&2
              exit 1
              ;;
          esac
          echo "docs_only=false" >> "$GITHUB_OUTPUT"

      - name: Checkout verified deploy SHA
        run: git checkout --detach "${{ steps.ref.outputs.sha }}"

      - name: Setup Node (runner-local, not host-wide)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy
        if: steps.detect.outputs.docs_only != 'true' && (steps.detect.outputs.content == 'true' || steps.detect.outputs.service == 'true')
        env:
          MUSEFOLD_SITE_ROOT: /opt/musefold/site/Musefold
          MUSEFOLD_COMPOSE_DIR: /opt/musefold
        run: |
          set -euo pipefail
          LAYERS=""
          if [ "${{ steps.detect.outputs.content }}" = "true" ]; then
            LAYERS="content"
          fi
          if [ "${{ steps.detect.outputs.service }}" = "true" ]; then
            LAYERS="${LAYERS:+$LAYERS,}service"
          fi
          node scripts/deploy/run.mjs \
            --sha "${{ steps.ref.outputs.sha }}" \
            --layers "$LAYERS" \
            --repo-root "$GITHUB_WORKSPACE" \
            --site-root "${MUSEFOLD_SITE_ROOT}" \
            --compose-dir "${MUSEFOLD_COMPOSE_DIR}"
