# Desktop Linux + Windows CI on GitHub-hosted runners.
# Gated by the `desktop` path group. Does not block Web/API deploy:
# Deploy production listens to workflow `CI` (source checks) only.
#
# macOS / Windows installers are published by package-smoke.yml on v* tags.
# Do not run these jobs on musefold-prod.
name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CI: true
  MUSEFOLD_TVT_KEY: ''
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect changed layers
        id: detect
        run: node .github/scripts/detect-layers.mjs

  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux Electron E2E
          - os: windows-latest
            name: Windows Electron E2E
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'apps/desktop/electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH "$(which python)" -m playwright install-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build app
        run: npm run build

      - name: Prove Electron binary
        run: |
          python -c "
          from pathlib import Path
          import os, sys
          dist = Path('node_modules/electron/dist')
          print('dist', dist, 'exists', dist.exists())
          if dist.exists():
              print('dist listing', sorted(p.name for p in dist.iterdir())[:30])
          cands = [dist / ('electron.exe' if os.name == 'nt' else 'electron'), Path('node_modules/.bin/electron')]
          if os.name != 'nt':
              cands.append(Path('node_modules/.bin/electron.cmd'))
          for path in cands:
              print('candidate', path, 'is_file', path.is_file())
              if path.is_file():
                  sys.exit(0)
          sys.exit(1)
          "

      - name: Full Electron E2E
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" python -m pytest tests/e2e -q --junitxml=e2e-junit.xml --maxfail=8

      - name: Full Electron E2E
        if: runner.os == 'Windows'
        run: python -m pytest tests/e2e -q --junitxml=e2e-junit.xml --maxfail=8

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ runner.os }}
          path: e2e-junit.xml
          if-no-files-found: ignore
