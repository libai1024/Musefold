# Desktop Linux + Windows CI on GitHub-hosted runners.
# Gated by the `desktop` path group. Does not block Web/API deploy:
# Deploy production listens to workflow `CI` (source checks) only.
#
# macOS / Windows installers are published by package-smoke.yml on v* tags.
# Do not run these jobs on musefold-prod.
name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: 'pytest target, e.g. tests/e2e/test_29_ember_slip_paths.py::test_slip_pickup_from_selection'
        required: false
        default: tests/e2e
      markers:
        description: 'pytest -m expression; leave empty to keep the per-platform default'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CI: true
  MUSEFOLD_TVT_KEY: ''
  NODE_VERSION: '24'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  changes:
    name: Detect changed layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect changed layers
        id: detect
        run: node .github/scripts/detect-layers.mjs

  # Platform tiers. Linux is Tier 1: full suite, blocks the merge. Windows is
  # Tier 2: it proves a clean checkout builds and that path separators, CRLF and
  # native modules behave, but it has no interactive window station, so the
  # `gui` tests (real clipboard/focus) are covered on a real Windows desktop.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    continue-on-error: ${{ !matrix.blocking }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux Electron E2E
            blocking: true
            markers: ''
          - os: windows-latest
            name: Windows Electron E2E
            blocking: false
            markers: not gui
    env:
      PYTEST_TARGET: ${{ inputs.tests || 'tests/e2e' }}
      PYTEST_MARKERS: ${{ inputs.markers || matrix.markers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'apps/desktop/electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip
          sudo --preserve-env=PATH "$(which python)" -m playwright install-deps

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Build app
        run: npm run build

      - name: Build CLI
        run: node scripts/build-cli.mjs

      - name: Prove Electron binary
        run: |
          python -c "
          from pathlib import Path
          import os, sys
          dist = Path('node_modules/electron/dist')
          print('dist', dist, 'exists', dist.exists())
          if dist.exists():
              print('dist listing', sorted(p.name for p in dist.iterdir())[:30])
          cands = [dist / ('electron.exe' if os.name == 'nt' else 'electron'), Path('node_modules/.bin/electron')]
          if os.name != 'nt':
              cands.append(Path('node_modules/.bin/electron.cmd'))
          for path in cands:
              print('candidate', path, 'is_file', path.is_file())
              if path.is_file():
                  sys.exit(0)
          sys.exit(1)
          "

      - name: Prove Playwright
        run: |
          python <<'PY'
          import sys
          import traceback
          print('executable', sys.executable)
          print('version', sys.version)
          try:
              import pytest
              from playwright.sync_api import sync_playwright
              print('pytest', pytest.__version__, 'sync_playwright', sync_playwright)
          except Exception:
              tb = traceback.format_exc()
              print(tb)
              escaped = tb.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=Playwright import::{escaped}')
              raise
          PY

      - name: Electron E2E
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            python -m pytest "$PYTEST_TARGET" ${PYTEST_MARKERS:+-m "$PYTEST_MARKERS"} \
            -vv --tb=short --junitxml=e2e-junit.xml | tee e2e.log

      - name: Electron E2E
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          if ! python -m pytest "$PYTEST_TARGET" ${PYTEST_MARKERS:+-m "$PYTEST_MARKERS"} \
            -vv --tb=short --junitxml=e2e-junit.xml | tee e2e.log; then
            echo "Hosted Windows runner had failures; retrying only last-failed tests in a clean process."
            python -m pytest "$PYTEST_TARGET" ${PYTEST_MARKERS:+-m "$PYTEST_MARKERS"} \
              --lf -vv --tb=short --junitxml=e2e-junit-rerun.xml | tee -a e2e.log
          fi

      - name: Annotate E2E failure
        if: failure()
        run: |
          python <<'PY'
          from pathlib import Path
          log = Path('e2e.log')
          text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'e2e.log missing'
          lines = [
              line for line in text.splitlines()
              if line.startswith(('FAILED ', 'ERROR ', '=')) or ' passed,' in line
          ]
          summary = '\n'.join(lines[-40:] if lines else text[-2000:].splitlines())
          escaped = summary.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error title=Electron E2E::{escaped}')
          PY

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ runner.os }}
          path: |
            e2e-junit.xml
            e2e.log
          if-no-files-found: ignore
