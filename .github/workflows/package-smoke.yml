# Slow-lane package smoke (macOS + Windows) plus website publish.
# Official site download buttons use /api/download?platform=...&version=latest
# Triggered by version tags (v*) and workflow_dispatch — not by ordinary push/PR.
# Prerequisite: main-branch CI ("Source checks") is already green. These jobs no
# longer `needs: check` because a tag push does not always run ci.yml.
#
# App semver single source of truth: `apps/desktop/package.json`.
name: Package smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: copy installers onto zhaozhaoyue.top after smoke
        type: boolean
        default: true

permissions:
  contents: read

env:
  CI: true
  MUSEFOLD_TVT_KEY: ""
  NODE_VERSION: "24"

jobs:
  mac-package-smoke:
    name: macOS package smoke
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      # Hosted runners have Xcode but no Developer ID. Unsigned ad-hoc packages
      # still produce the DMG/ZIP the website publishes to updates/dev/.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'apps/desktop/electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Build renderer
        run: npm run build

      - name: Build CLI and MCP
        run: node scripts/build-cli.mjs

      - name: Package unsigned macOS app
        run: node scripts/run-builder.mjs --mac --arm64 --dir

      - name: Ad-hoc sign
        run: node scripts/sign-macos-adhoc.mjs

      - name: Wrap DMG and ZIP
        run: node scripts/run-builder.mjs --mac dmg zip --arm64 --prepackaged ../../release/mac-arm64/Musefold.app

      - name: List release outputs
        if: failure()
        run: ls -la release release/mac-arm64 packages/cli/dist packages/mcp/dist apps/desktop/out/main 2>&1 | head -80

      - name: Verify DMG
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          hdiutil verify "release/Musefold-${VERSION}-arm64.dmg"

      - name: macOS signing evidence reminder (macosDeveloperIdNotarization)
        run: npm run release:macos:signing

      - name: macOS package smoke test
        run: python -m pytest tests/package/macos_package_smoke.py -q

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows-package-smoke:
    name: Windows package and runtime smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-artifacts-${{ hashFiles('package-lock.json', 'apps/desktop/electron-builder.yml') }}

      - name: Install deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Build Windows package
        run: npm run package:win -- --arm64

      - name: Windows package smoke test
        run: python -m pytest tests/package/windows_package_smoke.py -q

      - name: Build Windows host package for runtime smoke
        run: npm run package:win -- --x64

      - name: Windows installed-package runtime smoke
        run: python -m pytest tests/package/windows_runtime_smoke.py -q

      - name: Write Windows hosted runtime evidence
        run: npm run release:windows:hosted -- --runtime-smoke-passed --out release/windows-hosted-runtime-evidence.json

      - name: Upload Windows hosted runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-hosted-runtime-evidence
          path: release/windows-hosted-runtime-evidence.json

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-installers:
    name: Publish installers to website
    needs: [mac-package-smoke, windows-package-smoke]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: [self-hosted, musefold-prod]
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (runner-local, not host-wide)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: artifacts/mac-installers

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: win-installers
          path: artifacts/win-installers

      - name: Publish to zhaozhaoyue.top downloads
        env:
          MUSEFOLD_SITE_ROOT: /opt/musefold/site/Musefold
        run: |
          set -euo pipefail
          TAG_ARGS=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_ARGS=(--tag "${GITHUB_REF_NAME}")
          fi
          node scripts/deploy/publish-desktop.mjs \
            "${TAG_ARGS[@]}" \
            --mac-dir artifacts/mac-installers \
            --win-dir artifacts/win-installers \
            --site-root "${MUSEFOLD_SITE_ROOT}" \
            --repo-root "$GITHUB_WORKSPACE"
