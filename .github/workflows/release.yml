# v2.5 发布矩阵(M5-b):tag(v*)→ 全量检查 → macOS + Windows 打包与产物冒烟
# → 站点发布(安装包 + electron-updater feed)+ GitHub Release。
#
# App semver 单一事实源:apps/desktop/package.json(Changesets 管版本记录)。
# macOS 签名:hosted runner 无 Developer ID 时走 ad-hoc(产物进 updates/dev 通道);
# 配好 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID secrets 后自动切正式签名 + 公证。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 冒烟通过后发布安装包到 zhaozhaoyue.top
        type: boolean
        default: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  package-lifetime:
    uses: ./.github/workflows/package-lifetime.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source secret scan
        run: node scripts/security/scan.mjs source --report tests/v25/.results/security/source.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-security-results
          path: tests/v25/.results/security/source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Full checks
        run: pnpm exec turbo run lint typecheck test build check:boundaries
      - name: Web production build
        run: pnpm run build:web
      # R01.6:同一构建身份的 manifest,成功与失败都要可追溯;web 构建未产出时
      # 仅记录身份字段(webBuildId=null),产物哈希归打包 job。
      - name: Generate build manifest
        if: always()
        run: node scripts/build/v25-build-manifest.mjs --out tests/v25/.results/build-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-manifest
          path: tests/v25/.results/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API Testcontainers
        run: pnpm --filter @musefold/api run test:integration --reporter=default --reporter=junit --outputFile=test-results/api-integration.xml
      - name: Two independent sync clients with real HTTP PostgreSQL
        env:
          RUN_DATABASE_TESTS: '1'
          TWO_DEVICE_RESULTS_DIR: apps/api/test-results/two-device-sync
        run: pnpm exec vitest run tests/repo/v25-sync-two-devices.test.ts --reporter=default --reporter=junit --outputFile=apps/api/test-results/two-device-sync.xml
      - name: Build official worker runtime image
        run: docker build --file apps/worker/Dockerfile --tag musefold-worker-ci:local .
      - name: Worker disposable runtime
        env:
          RUN_WORKER_CONTAINER_TESTS: 'true'
          WORKER_CONTAINER_IMAGE: musefold-worker-ci:local
        run: pnpm --filter @musefold/worker run test:integration --reporter=default --reporter=junit --outputFile=test-results/worker-integration.xml
      - name: desktop-db bundle freshness
        run: |
          pnpm --filter @musefold/desktop-db run db:bundle
          git diff --exit-code -- packages/desktop-db/src/migrations.generated.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-integration-results
          path: apps/*/test-results/
          if-no-files-found: error
          retention-days: 14

  # 双端 E2E(M5-a):Playwright web(桌面/移动视口)+ Electron。
  # 跑在 macOS:视觉基线在 darwin 生成可直接复用,Electron 真窗口无需 xvfb。
  e2e:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Playwright E2E(web + electron)
        run: pnpm run test:e2e
      - name: Require E2E execution report
        if: always()
        run: test -s tests/v25/.results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            tests/v25/.results/
            tests/v25/__screenshots__/
          retention-days: 14

  server-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t musefold/api:v2.5 .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t musefold/worker:v2.5 .
      # R01.2:镜像携带当次构建身份;version 与发布矩阵同源(apps/desktop/package.json)。
      - name: Build standalone Web image
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build -f apps/web-next/Dockerfile -t musefold/web:v2.5 \
            --build-arg NEXT_PUBLIC_GIT_COMMIT="${{ github.sha }}" \
            --build-arg NEXT_PUBLIC_APP_VERSION="$VERSION" \
            --build-arg NEXT_PUBLIC_BUILT_AT="$BUILT_AT" .
      - name: Standalone Web container smoke
        run: node scripts/verify-v25-web-image.mjs

  mac-package:
    needs: [verify, database-integration, package-lifetime, e2e, server-images]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 无 Developer ID 的 hosted runner 明确关掉钥匙串自动发现,走 ad-hoc。
      MUSEFOLD_PACKAGE_ARCH: arm64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/electron-builder.yml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Package(signed)
        if: env.CSC_LINK != ''
        run: pnpm run package:mac --arm64
      - name: Package(ad-hoc,无签名证书)
        if: env.CSC_LINK == ''
        run: pnpm run package:mac:adhoc
      - name: Verify DMG
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          hdiutil verify "release/Musefold-${VERSION}-arm64.dmg"
      - name: 打包产物冒烟(Playwright)
        run: pnpm exec playwright test -c tests/v25/playwright.package.config.ts
      - name: Scan App, ZIP and mounted DMG
        run: node scripts/security/scan-packages.mjs tests/v25/.results/package/security.json
      - name: Bind macOS installers to build and verification identity
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          node scripts/build/v25-build-manifest.mjs \
            --out tests/v25/.results/package/mac-build-manifest.json \
            --artifact "mac-dmg=release/Musefold-${VERSION}-arm64.dmg" \
            --artifact "mac-zip=release/Musefold-${VERSION}-arm64-mac.zip" \
            --artifact "mac-update-feed=release/latest-mac.yml" \
            --artifact "package-tests=tests/v25/.results/package/report.json" \
            --artifact "package-security=tests/v25/.results/package/security.json"
      - name: Require package execution report
        if: always()
        run: test -s tests/v25/.results/package/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-package-test-results
          include-hidden-files: true
          if-no-files-found: error
          path: tests/v25/.results/package/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build-manifest
          path: tests/v25/.results/package/mac-build-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  win-package:
    needs: [verify, database-integration, package-lifetime, e2e, server-images]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MUSEFOLD_PACKAGE_ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/electron-builder.yml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Package Windows(nsis,x64)
        run: pnpm run package:win --x64
      - name: 打包产物冒烟(Playwright,win-unpacked)
        run: pnpm exec playwright test -c tests/v25/playwright.package.config.ts
      - name: Scan unpacked App and extracted NSIS payload
        run: node scripts/security/scan-packages.mjs tests/v25/.results/package/security.json
      - name: Bind Windows installer to build and verification identity
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          node scripts/build/v25-build-manifest.mjs \
            --out tests/v25/.results/package/win-build-manifest.json \
            --artifact "windows-nsis=release/Musefold-${VERSION}-x64-Setup.exe" \
            --artifact "windows-update-feed=release/latest.yml" \
            --artifact "package-tests=tests/v25/.results/package/report.json" \
            --artifact "package-security=tests/v25/.results/package/security.json"
      - name: Require package execution report
        if: always()
        run: test -s tests/v25/.results/package/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-package-test-results
          include-hidden-files: true
          if-no-files-found: error
          path: tests/v25/.results/package/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: win-build-manifest
          path: tests/v25/.results/package/win-build-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: win-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  # 安装包 + electron-updater feed 发布到自有站点(与旧发布链同一脚本)。
  publish-site:
    name: Publish installers and update feed
    needs: [verify, mac-package, win-package]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: [self-hosted, musefold-prod]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: artifacts/mac-installers
      - uses: actions/download-artifact@v4
        with:
          name: win-installers
          path: artifacts/win-installers
      - name: Publish to zhaozhaoyue.top(downloads + updates feed)
        env:
          MUSEFOLD_SITE_ROOT: /opt/musefold/site/Musefold
        run: |
          set -euo pipefail
          TAG_ARGS=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_ARGS=(--tag "${GITHUB_REF_NAME}")
          fi
          node scripts/deploy/publish-desktop.mjs \
            "${TAG_ARGS[@]}" \
            --mac-dir artifacts/mac-installers \
            --win-dir artifacts/win-installers \
            --site-root "${MUSEFOLD_SITE_ROOT}" \
            --repo-root "$GITHUB_WORKSPACE"

  github-release:
    needs: [verify, mac-package, win-package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: win-installers
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: mac-build-manifest
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: win-build-manifest
          path: artifacts
      - uses: softprops/action-gh-release@v2
        # Manifests are downloaded separately to preserve the flat installer layout.
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*-build-manifest.json
