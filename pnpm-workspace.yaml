packages:
  - apps/*
  - packages/*

# electron-builder 与原生模块(better-sqlite3)依赖 npm 式扁平 node_modules 布局
nodeLinker: hoisted

# 依赖构建脚本许可(pnpm 11 机制:默认阻止依赖的 install/postinstall)
allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  cpu-features: true
  electron-winstaller: true
  protobufjs: true
  ssh2: true

# 自 npm overrides 迁移(v2.5 M1);openai 下的 zod 与根依赖保持同版本段
overrides:
  fast-xml-parser: 5.7.2
  inquirer: 8.2.7
  lighthouse: 13.4.1
  nanoid: 3.3.18
  tmp: 0.2.7
  uuid: 11.1.1
  'openai>zod': ^4.4.3
