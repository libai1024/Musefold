[pytest]
addopts = -ra --tb=short
junit_family = xunit2
markers =
    gui: needs an interactive desktop session (real OS clipboard, focus, native chrome).
        macOS locally and Linux under xvfb+xclip qualify. GitHub-hosted Windows
        runners do not: they have no interactive window station, so Desktop CI
        runs them with `-m "not gui"` and a real Windows machine covers them.
