<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Musefold 交互演示</title>
<style>
  /* ---------------------------------------------------------------------------
   * 官网可交互演示:静态复刻 Musefold 2.5 应用外壳(工作台 + 提示词库)。
   * 自包含、零依赖、零网络请求;固定 1440×900 内部画布,按容器缩放。
   * 视觉令牌与 packages/ui globals.css 对齐(2026-09 UI:细滚动条、极简模型 pill)。
   * ------------------------------------------------------------------------- */
  :root {
    --background: #f6f6f4; --foreground: #202124; --card: #ffffff;
    --sidebar: #efefec; --sidebar-accent: #e6e6e2;
    --border: #dfdfdb; --muted-fg: #74777c; --primary: #d6653f;
    --accent: #ecece9; --secondary: #f0f0ed;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--background); color: var(--foreground);
    overflow: hidden;
  }
  /* 细滚动条(与产品一致:8px 轨道 + 视觉 4px 圆角滑块) */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent; border-radius: 9999px;
    background: color-mix(in srgb, var(--muted-fg) 30%, transparent);
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--muted-fg) 50%, transparent);
    background-clip: padding-box;
  }

  #stage { position: fixed; inset: 0; display: flex; }
  #canvas {
    width: 1440px; height: 900px; flex: none;
    transform-origin: top left; display: flex; overflow: hidden;
  }

  /* ── 侧栏 ─────────────────────────────────────────────── */
  .sidebar {
    width: 248px; flex: none; display: flex; flex-direction: column;
    background: var(--sidebar); border-right: 1px solid var(--border);
  }
  .brand-row { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 16px; }
  .brand-mark {
    width: 16px; height: 16px; border-radius: 5px; flex: none;
    background: conic-gradient(from 210deg, #d6653f, #b54935 40%, #a96d1d 75%, #d6653f);
  }
  .brand-name { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
  .sidebar-collapse { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted-fg); cursor: pointer; display: grid; place-items: center; }
  .sidebar-collapse:hover { background: var(--accent); color: var(--foreground); }
  .new-chat { display: flex; align-items: center; gap: 10px; margin: 4px 12px 8px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-fg); font-size: 13px; cursor: pointer; }
  .new-chat:hover { background: rgba(230, 230, 226, 0.6); color: var(--foreground); }
  nav.main-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted-fg);
    font-size: 13px; text-align: left; cursor: pointer;
  }
  .nav-item svg { width: 15px; height: 15px; flex: none; }
  .nav-item:hover { background: rgba(230, 230, 226, 0.6); color: var(--foreground); }
  .nav-item.active { background: var(--sidebar-accent); color: var(--foreground); }
  .sessions-label { padding: 18px 22px 6px; font-size: 11px; color: var(--muted-fg); }
  .session-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 8px; }
  .session-row {
    position: relative; display: flex; align-items: center; gap: 8px; height: 34px;
    padding: 0 10px; margin-bottom: 1px; border-radius: 8px; font-size: 13px;
    color: #53565c; cursor: pointer; white-space: nowrap; overflow: hidden;
  }
  .session-row:hover { background: rgba(230, 230, 226, 0.6); }
  .session-row.active { background: var(--sidebar-accent); color: var(--foreground); }
  .session-row .t { overflow: hidden; text-overflow: ellipsis; }
  .session-row .time { margin-left: auto; flex: none; font-size: 11px; color: var(--muted-fg); }
  .account-row {
    display: flex; align-items: center; gap: 10px; margin: 8px 12px 12px; height: 36px;
    padding: 0 10px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted-fg); font-size: 13px; cursor: pointer;
  }
  .account-row:hover { background: rgba(230, 230, 226, 0.6); color: var(--foreground); }
  .avatar { width: 20px; height: 20px; border-radius: 9999px; background: linear-gradient(135deg, #d6653f, #a96d1d); flex: none; }

  /* ── 主区 ─────────────────────────────────────────────── */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); }
  .screen { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* 工作台 */
  .timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 12px; }
  .turn { max-width: 720px; margin: 0 auto 20px; }
  .turn-user {
    display: inline-flex; max-width: 100%; padding: 9px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border); font-size: 14px; line-height: 1.55;
  }
  .turn-result { margin-top: 10px; display: flex; gap: 10px; }
  .gen-card {
    width: 300px; border-radius: 12px; overflow: hidden; background: var(--card);
    border: 1px solid var(--border);
  }
  .gen-card .imgwrap { position: relative; aspect-ratio: 1; background: var(--secondary); }
  .gen-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gen-card.pending .imgwrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%);
    background-size: 220% 100%; animation: shimmer 1.1s linear infinite;
  }
  @keyframes shimmer { from { background-position: 160% 0; } to { background-position: -60% 0; } }
  .gen-meta { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; font-size: 11px; color: var(--muted-fg); }
  .gen-meta .model { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .welcome { max-width: 720px; margin: 96px auto 0; text-align: center; }
  .welcome h1 { font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
  .welcome p { margin-top: 8px; color: var(--muted-fg); font-size: 14px; }
  .suggests { margin-top: 26px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .suggest {
    border: 1px solid var(--border); background: var(--card); border-radius: 9999px;
    padding: 8px 16px; font-size: 13px; color: #53565c; cursor: pointer;
  }
  .suggest:hover { border-color: var(--primary); color: var(--primary); }

  /* Composer */
  .composer-wrap { padding: 6px 28px 18px; }
  .composer {
    max-width: 720px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 6px 24px rgba(32, 33, 36, 0.06);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .composer:focus-within { border-color: rgba(214, 101, 63, 0.55); box-shadow: 0 0 0 3px rgba(214, 101, 63, 0.14), 0 6px 24px rgba(32,33,36,0.06); }
  .composer textarea {
    display: block; width: 100%; min-height: 44px; max-height: 120px; padding: 13px 16px 6px;
    border: 0; outline: none; resize: none; background: transparent;
    font: inherit; font-size: 14px; line-height: 1.55; color: var(--foreground);
  }
  .composer textarea::placeholder { color: #a3a6ab; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 10px; }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px;
    border: 1px solid transparent; border-radius: 8px; background: transparent;
    color: var(--muted-fg); font-size: 12px; cursor: pointer;
  }
  .tool-btn:hover { background: var(--secondary); color: var(--foreground); }
  .tool-btn svg { width: 14px; height: 14px; }
  .tool-btn .ratio { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .toolbar .spacer { flex: 1; }
  /* 极简模型 pill(承 Codex/ZCode) */
  .model-pill-wrap { position: relative; }
  .model-pill {
    display: inline-flex; align-items: center; gap: 5px; height: 28px; max-width: 190px;
    padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent;
    color: var(--muted-fg); font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px; cursor: pointer;
  }
  .model-pill:hover { background: rgba(239, 239, 236, 0.85); color: var(--foreground); }
  .model-pill .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-pill svg { width: 12px; height: 12px; opacity: 0.6; flex: none; }
  .model-menu {
    position: absolute; right: 0; bottom: 36px; z-index: 30; min-width: 230px;
    background: #fdfcf9; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(32, 33, 36, 0.12); padding: 6px;
    display: none;
  }
  .model-menu.open { display: block; }
  .model-option {
    display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 8px 10px;
    border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer;
  }
  .model-option:hover { background: var(--accent); }
  .model-option .m { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; }
  .model-option .p { font-size: 11px; color: var(--muted-fg); }
  .model-option .check { display: none; margin-right: 6px; color: var(--primary); }
  .model-option.selected .check { display: inline; }
  .send-btn {
    width: 36px; height: 36px; flex: none; border: 0; border-radius: 9999px;
    background: var(--foreground); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .send-btn:hover { transform: translateY(-1px); }
  .send-btn:active { transform: translateY(1px) scale(0.96); }
  .send-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }
  .send-btn.stop { background: var(--card); color: var(--foreground); border: 1px solid var(--border); }
  .composer-hint { max-width: 720px; margin: 8px auto 0; text-align: center; font-size: 11px; color: #a3a6ab; }

  /* 提示词库 */
  .library { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 20px 28px 12px; }
  .library-inner { flex: 1; min-height: 0; max-width: 1060px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
  .lib-toolbar { display: flex; align-items: center; gap: 10px; }
  .lib-search {
    flex: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
  }
  .lib-search:focus-within { border-color: rgba(214, 101, 63, 0.55); box-shadow: 0 0 0 3px rgba(214, 101, 63, 0.14); }
  .lib-search svg { width: 14px; height: 14px; color: var(--muted-fg); flex: none; }
  .lib-search input { flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 13px; }
  .lib-filter {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    color: var(--muted-fg); font-size: 13px; cursor: pointer;
  }
  .lib-filter:hover { color: var(--foreground); }
  .new-prompt {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
    border: 0; border-radius: 9px; background: var(--primary); color: #fff;
    font-size: 13px; cursor: pointer;
  }
  .new-prompt:hover { background: #c25833; }
  .new-prompt svg { width: 14px; height: 14px; }
  .lib-tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .lib-tab {
    position: relative; padding: 8px 2px 10px; margin-right: 18px; border: 0;
    background: transparent; color: var(--muted-fg); font-size: 13px; cursor: pointer;
  }
  .lib-tab.active { color: var(--foreground); font-weight: 500; }
  .lib-tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    border-radius: 2px; background: var(--primary);
  }
  .lib-body { flex: 1; min-height: 0; display: flex; gap: 18px; padding-top: 12px; }
  .prompt-list { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
  .prompt-row {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  }
  .prompt-row:hover { border-color: var(--border); background: var(--card); }
  .prompt-row.selected { border-color: var(--border); background: var(--card); }
  .cover {
    width: 44px; height: 44px; flex: none; border-radius: 8px; overflow: hidden;
    background: var(--secondary); display: grid; place-items: center; color: var(--muted-fg);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .prompt-main { flex: 1; min-width: 0; }
  .prompt-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .prompt-title .pin { color: var(--primary); font-size: 11px; }
  .prompt-desc { margin-top: 2px; font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt-meta { margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-fg); }
  .tag { padding: 1px 7px; border-radius: 9999px; background: var(--accent); color: #53565c; }
  .prompt-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s ease; }
  .prompt-row:hover .prompt-actions, .prompt-row.selected .prompt-actions { opacity: 1; }
  .row-action { width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted-fg); cursor: pointer; display: grid; place-items: center; }
  .row-action:hover { background: var(--accent); color: var(--foreground); }
  .row-action svg { width: 14px; height: 14px; }
  .inspector {
    width: 340px; flex: none; overflow-y: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  }
  .inspector h3 { font-size: 15px; font-weight: 600; }
  .inspector .sec { margin-top: 14px; font-size: 11px; color: var(--muted-fg); }
  .inspector .content {
    margin-top: 6px; padding: 10px 12px; border-radius: 8px; background: var(--secondary);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.6;
    color: #3c3f44;
  }
  .related { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .related img { width: 100%; aspect-ratio: 1; border-radius: 7px; object-fit: cover; cursor: pointer; }
  .insp-meta { margin-top: 12px; font-size: 11px; color: var(--muted-fg); line-height: 1.8; }
  .use-btn {
    margin-top: 14px; width: 100%; height: 34px; border: 0; border-radius: 9px;
    background: var(--primary); color: #fff; font-size: 13px; cursor: pointer;
  }
  .use-btn:hover { background: #c25833; }
  .empty { padding: 40px 0; text-align: center; color: var(--muted-fg); font-size: 13px; }
</style>
</head>
<body>
<div id="stage"><div id="canvas">
  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="brand-row">
      <span class="brand-mark"></span><span class="brand-name">Musefold</span>
      <button class="sidebar-collapse" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
      新设计 <span style="margin-left:auto;font-size:10px;color:#a3a6ab">⌘N</span>
    </button>
    <nav class="main-nav" id="nav">
      <button class="nav-item active" data-screen="workbench">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v9h-9"/></svg>
        工作台
      </button>
      <button class="nav-item" data-screen="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="m3 12 9 5 9-5"/></svg>
        提示词库
      </button>
      <button class="nav-item" data-screen="schemes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        设计方案
      </button>
      <button class="nav-item" data-screen="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        生成历史
      </button>
    </nav>
    <p class="sessions-label">对话</p>
    <div class="session-list" id="sessionList"></div>
    <button class="account-row">
      <span class="avatar"></span> 登录账号 <span style="margin-left:auto;font-size:11px">同步与云生图</span>
    </button>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <!-- 工作台 -->
    <section class="screen active" id="screen-workbench">
      <div class="timeline" id="timeline">
        <div class="welcome" id="welcome">
          <h1>晚上好，灵感正好</h1>
          <p>把想法变成可生成的视觉</p>
          <div class="suggests">
            <button class="suggest">漂浮在云层上的小型图书馆，克制电影感，阴天漫射光</button>
            <button class="suggest">透明背景护肤品主视觉，柔和反射，高端广告质感</button>
            <button class="suggest">雨夜东京街角，低饱和自然光，对角线构图</button>
          </div>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="promptInput" rows="1" placeholder="描述你想生成的图片…（Enter 发送）"></textarea>
          <div class="toolbar">
            <button class="tool-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              添加上下文
            </button>
            <button class="tool-btn"><span class="ratio">auto 自动</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
            </button>
            <button class="tool-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
              标准
            </button>
            <span class="spacer"></span>
            <span class="model-pill-wrap">
              <button class="model-pill" id="modelPill" aria-haspopup="listbox" aria-label="账号模型">
                <span class="name">musefold-image-pro</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="model-menu" id="modelMenu" role="listbox">
                <button class="model-option selected" data-model="musefold-image-pro" data-price="1.2 积分/次" role="option">
                  <span><span class="check">✓</span><span class="m">musefold-image-pro</span></span>
                  <span class="p">1.2 积分/次</span>
                </button>
                <button class="model-option" data-model="gpt-image-2" data-price="2.4 积分/次" role="option">
                  <span><span class="check">✓</span><span class="m">gpt-image-2</span></span>
                  <span class="p">2.4 积分/次</span>
                </button>
              </div>
            </span>
            <button class="send-btn" id="sendBtn" disabled aria-label="生成图像" title="生成图像(Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-hint">内容由本地演示提供 · 与应用内一致的工作台体验</p>
      </div>
    </section>

    <!-- 提示词库 -->
    <section class="screen" id="screen-library">
      <div class="library">
        <div class="library-inner">
          <div class="lib-toolbar">
            <label class="lib-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="libSearch" placeholder="搜索提示词、标签或内容…" />
            </label>
            <button class="lib-filter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              筛选
            </button>
            <button class="new-prompt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              新建提示词
            </button>
          </div>
          <div class="lib-tabs">
            <button class="lib-tab active">库</button>
            <button class="lib-tab">回收站</button>
          </div>
          <div class="lib-body">
            <div class="prompt-list" id="promptList"></div>
            <aside class="inspector" id="inspector"></aside>
          </div>
        </div>
      </div>
    </section>
  </main>
</div></div>

<script>
'use strict';
/* ── 画布缩放:固定 1440×900,等比适配 iframe ── */
function fit() {
  var c = document.getElementById('canvas');
  var s = Math.min(innerWidth / 1440, innerHeight / 900);
  c.style.transform = 'scale(' + s + ')';
  c.style.marginLeft = Math.max(0, (innerWidth - 1440 * s) / 2) + 'px';
  c.style.marginTop = Math.max(0, (innerHeight - 900 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ── 数据 ── */
var WORKS = ['../works/floating-library.png', '../works/away-from-agent-loop.png'];
var PROMPTS = [
  { t: '漂浮在云层上的小型图书馆', d: 'cinematic lighting, soft shadows, muted palette…', tags: ['场景', '概念图'], n: 12, pin: true, img: WORKS[0] },
  { t: '透明背景护肤品主视觉', d: 'soft reflections, premium advertising, studio…', tags: ['质感', '海报'], n: 9, pin: true, img: WORKS[1] },
  { t: '雨夜东京街角', d: 'low saturation, lifestyle, diagonal composition…', tags: ['场景'], n: 7, pin: false, img: null },
  { t: '水彩凤凰,留白构图', d: 'ink wash, negative space, delicate texture…', tags: ['插画'], n: 5, pin: false, img: null },
  { t: '深空站内景,体积光', d: 'volumetric light, sci-fi interior, wide shot…', tags: ['场景', '概念图'], n: 4, pin: false, img: null },
  { t: '极简建筑摄影,硬阴影', d: 'brutalist, hard shadow, minimal composition…', tags: ['摄影'], n: 3, pin: false, img: null },
  { t: '霓虹雨衣人像,胶片颗粒', d: 'film grain, neon, cinematic portrait…', tags: ['人物'], n: 2, pin: false, img: null },
  { t: '宋代山水,水墨雾气', d: 'ink mist, song dynasty landscape, layered…', tags: ['插画', '场景'], n: 1, pin: false, img: null },
];
var SESSIONS = [
  { t: '图书馆概念 — 第二版', time: '刚刚' },
  { t: '护肤品主视觉探索', time: '2 小时前' },
  { t: '东京街角氛围参考', time: '昨天' },
  { t: '凤凰水墨试验', time: '周二' },
  { t: '深空站分镜', time: '上周' },
];

/* ── 侧栏会话 ── */
var sessionList = document.getElementById('sessionList');
SESSIONS.forEach(function (s, i) {
  var row = document.createElement('div');
  row.className = 'session-row' + (i === 0 ? ' active' : '');
  row.innerHTML = '<span class="t"></span><span class="time"></span>';
  row.querySelector('.t').textContent = s.t;
  row.querySelector('.time').textContent = s.time;
  row.onclick = function () {
    sessionList.querySelectorAll('.session-row').forEach(function (r) { r.classList.remove('active'); });
    row.classList.add('active');
    if (document.getElementById('screen-workbench').classList.contains('active')) return;
    switchScreen('workbench');
  };
  sessionList.appendChild(row);
});

/* ── 导航 ── */
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  var target = document.getElementById('screen-' + name) || document.getElementById('screen-workbench');
  target.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function (b) {
    b.classList.toggle('active', b.dataset.screen === name);
  });
}
document.getElementById('nav').addEventListener('click', function (e) {
  var btn = e.target.closest('.nav-item');
  if (!btn) return;
  switchScreen(btn.dataset.screen === 'library' ? 'library' : 'workbench');
});
if (location.hash === '#library') switchScreen('library');

/* ── 工作台:输入 → 生成 ── */
var input = document.getElementById('promptInput');
var sendBtn = document.getElementById('sendBtn');
var timeline = document.getElementById('timeline');
var welcome = document.getElementById('welcome');
var currentModel = 'musefold-image-pro';

input.addEventListener('input', function () {
  sendBtn.disabled = !input.value.trim();
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
});
sendBtn.addEventListener('click', generate);
document.querySelectorAll('.suggest').forEach(function (b) {
  b.addEventListener('click', function () { input.value = b.textContent; input.dispatchEvent(new Event('input')); generate(); });
});

function generate() {
  var text = input.value.trim();
  if (!text || sendBtn.classList.contains('stop')) return;
  welcome.style.display = 'none';
  var turn = document.createElement('div');
  turn.className = 'turn';
  var user = document.createElement('div');
  user.className = 'turn-user'; user.textContent = text;
  var result = document.createElement('div');
  result.className = 'turn-result';
  var card = document.createElement('div');
  card.className = 'gen-card pending';
  card.innerHTML = '<div class="imgwrap"></div><div class="gen-meta"><span class="model"></span><span>生成中…</span></div>';
  card.querySelector('.model').textContent = currentModel;
  result.appendChild(card);
  turn.append(user, result);
  timeline.appendChild(turn);
  timeline.scrollTop = timeline.scrollHeight;
  input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;

  var work = WORKS[Math.floor(Math.random() * WORKS.length)];
  setTimeout(function () {
    card.classList.remove('pending');
    card.querySelector('.imgwrap').innerHTML = '<img alt="生成结果" src="' + work + '" />';
    card.querySelector('.gen-meta').lastElementChild.textContent = '1024 × 1024 · ' + currentModel.replace('musefold-', '');
  }, 1400);
}

/* ── 模型菜单 ── */
var pill = document.getElementById('modelPill');
var menu = document.getElementById('modelMenu');
pill.addEventListener('click', function (e) { e.stopPropagation(); menu.classList.toggle('open'); });
menu.addEventListener('click', function (e) {
  var opt = e.target.closest('.model-option');
  if (!opt) return;
  menu.querySelectorAll('.model-option').forEach(function (o) { o.classList.remove('selected'); });
  opt.classList.add('selected');
  currentModel = opt.dataset.model;
  pill.querySelector('.name').textContent = currentModel;
  menu.classList.remove('open');
});
document.addEventListener('click', function () { menu.classList.remove('open'); });

/* ── 提示词库 ── */
var list = document.getElementById('promptList');
var inspector = document.getElementById('inspector');
var search = document.getElementById('libSearch');

function renderList(filter) {
  var q = (filter || '').trim().toLowerCase();
  list.innerHTML = '';
  var rows = PROMPTS.filter(function (p) {
    return !q || p.t.toLowerCase().includes(q) || p.d.toLowerCase().includes(q) || p.tags.join(' ').includes(q);
  });
  if (!rows.length) { list.innerHTML = '<div class="empty">没有匹配的提示词</div>'; return; }
  rows.forEach(function (p, i) {
    var row = document.createElement('div');
    row.className = 'prompt-row';
    row.innerHTML =
      '<div class="cover">' + (p.img ? '<img alt="" src="' + p.img + '" />' :
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M10 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M18 2v4"/><path d="M22 6v4"/></svg>') + '</div>' +
      '<div class="prompt-main">' +
        '<div class="prompt-title">' + (p.pin ? '<span class="pin">📌</span>' : '') + '<span></span></div>' +
        '<div class="prompt-desc"></div>' +
        '<div class="prompt-meta">' + p.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') +
          '<span>使用 ' + p.n + ' 次</span><span>·</span><span>最近更新</span></div>' +
      '</div>' +
      '<div class="prompt-actions">' +
        '<button class="row-action" title="使用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>' +
        '<button class="row-action" title="复制内容"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>' +
      '</div>';
    row.querySelector('.prompt-title span:last-child').textContent = p.t;
    row.querySelector('.prompt-desc').textContent = p.d;
    row.onclick = function () {
      list.querySelectorAll('.prompt-row').forEach(function (r) { r.classList.remove('selected'); });
      row.classList.add('selected');
      renderInspector(p);
    };
    if (i === 0 && !q) { row.classList.add('selected'); renderInspector(p); }
    list.appendChild(row);
  });
}
function renderInspector(p) {
  inspector.innerHTML =
    '<h3></h3>' +
    '<p class="sec">提示词正文</p><div class="content"></div>' +
    '<p class="sec">相关作品</p><div class="related">' +
      WORKS.concat(WORKS).slice(0, 3).map(function (w) { return '<img alt="相关作品" src="' + w + '" />'; }).join('') +
    '</div>' +
    '<div class="insp-meta">使用 12 次 · 创建于 9 月 · 最近更新</div>' +
    '<button class="use-btn">使用 —— 回填工作台</button>';
  inspector.querySelector('h3').textContent = p.t;
  inspector.querySelector('.content').textContent = p.d + ' — 可直接复用与二次改编的完整提示词。';
  inspector.querySelector('.use-btn').onclick = function () {
    switchScreen('workbench');
    input.value = p.t + ',' + p.d;
    input.dispatchEvent(new Event('input'));
  };
}
search.addEventListener('input', function () { renderList(search.value); });
renderList();
</script>
</body>
</html>
